version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "15:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 7
    # "deps:" type routes commits into release-please's Dependency Updates
    # changelog section; actions bumps stay hidden as "ci".
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "11:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
