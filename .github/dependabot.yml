version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "15:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 7
    # Indirect deps land in scanner alerts too, and Dependabot skips them
    # unless "all" is allowed explicitly.
    allow:
      - dependency-type: "all"
    # Collapse routine bumps into one weekly PR. Majors and security updates
    # stay ungrouped so breaking or urgent changes land reviewable on their own.
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # "deps:" type routes commits into release-please's Dependency Updates
    # changelog section; actions bumps stay hidden as "ci".
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "11:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
  - package-ecosystem: "docker"
    directory: "/"
    # Go ships release candidates as a new minor (1.27rc2 before 1.27.0) and
    # Dependabot fails to detect those tags as pre-releases, so block minor
    # bumps for golang and move the builder to a new Go minor by hand.
    ignore:
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
